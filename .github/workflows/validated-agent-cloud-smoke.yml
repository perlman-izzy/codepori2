name: Validated Agent Cloud Autowork

on:
  push:
    branches:
      - validated-agent-cloud-20260827
    paths:
      - 'validated_agent_cloud/**'
      - '.github/workflows/validated-agent-cloud-smoke.yml'

permissions:
  contents: write

concurrency:
  group: validated-agent-cloud-autowork
  cancel-in-progress: true

jobs:
  autowork:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "validated-agent-cloud-20260827"
          test "$(git branch --show-current)" = "validated-agent-cloud-20260827"
      - name: Run autonomous loop v5
        env:
          AUTOWORK_MAX_ITERATIONS: '50'
          AUTOWORK_SLEEP_SECONDS: '300'
          AUTOWORK_TRANSPORT_RETRY_SECONDS: '60'
          AUTOWORK_PROVIDER_TIMEOUT_SECONDS: '30'
          AUTOWORK_MAX_RESPONSE_TOKENS: '3000'
          AUTOWORK_MAX_TRANSPORT_ATTEMPTS: '60'
        run: python3 validated_agent_cloud/autowork_v5.py

name: Validated Agent Cloud Smoke

on:
  push:
    branches:
      - validated-agent-cloud-20260827
    paths:
      - 'validated_agent_cloud/**'
      - '.github/workflows/validated-agent-cloud-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'validated_agent_cloud/**'
      - '.github/workflows/validated-agent-cloud-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated head
        shell: bash
        run: |
          set -euo pipefail
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF head=${GITHUB_HEAD_REF:-}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test "$GITHUB_HEAD_REF" = "validated-agent-cloud-20260827"
          else
            test "$GITHUB_REF_NAME" = "validated-agent-cloud-20260827"
          fi
      - name: Credential-free model smoke
        run: python3 validated_agent_cloud/free_model_smoke.py
